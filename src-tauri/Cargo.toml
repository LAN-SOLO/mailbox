[package]
name = "mailbox"
version = "0.1.0"
description = "mailbox — Mail-Client mit zwei Modi (IMAP/SMTP)"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mailbox-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
base64 = "0.22"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
mail-parser = "0.11"
imap-proto = "0.16"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sys-locale = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
